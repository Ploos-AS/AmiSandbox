name: AmiSandbox M2.3 Removable Media Isolation Qualification

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/osdep/main.cpp'
      - 'src/cfgfile.cpp'
      - 'src/include/options.h'
      - 'tools/check_amisandbox_m2_0.py'
      - 'tools/check_amisandbox_m2_1.py'
      - 'tools/check_amisandbox_m2_2.py'
      - 'tools/check_amisandbox_m2_3.py'
      - 'docs/M2_3_QUALIFICATION.md'
      - '.github/workflows/amisandbox-m2_3-qual.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'

permissions:
  contents: read

jobs:
  qualify-m2_3-removable-media-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build xvfb xauth \
            libflac-dev libmpeg2-4-dev libpng-dev libasound2-dev \
            libmpg123-dev libportmidi-dev libserialport-dev libenet-dev \
            libpcap-dev libzstd-dev libcurl4-openssl-dev nlohmann-json3-dev

      - name: Install SDL3 and SDL3_image
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3.2.8
          version-sdl-image: 3.2.4
          pre-release: false

      - name: Static M1 through M2.3 contract checks
        run: |
          python3 tools/check_amisandbox_m1.py
          python3 tools/check_amisandbox_m1_1.py
          python3 tools/check_amisandbox_m1_2.py
          python3 tools/check_amisandbox_m2_0.py
          python3 tools/check_amisandbox_m2_1.py
          python3 tools/check_amisandbox_m2_2.py
          python3 tools/check_amisandbox_m2_3.py

      - name: Build non-JIT analysis binary
        run: |
          cmake -S . -B build-m2_3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }}' \
            -DUSE_JIT=OFF \
            -DUSE_IPC_SOCKET=ON \
            -DUSE_PPC=OFF \
            -DUSE_QEMU_PPC=OFF
          cmake --build build-m2_3 -j"$(nproc)"

      - name: Analysis mode protects original floppy image
        shell: bash
        env:
          AMISANDBOX_ANALYSIS_DIR: /tmp/amisandbox-m2_3-analysis
          AMISANDBOX_MACHINE_PROFILE: a500-aros-ci
          AMISANDBOX_CONFIG_FINGERPRINT: github-actions-m2_3-removable-media-negative
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          EVIDENCE=/tmp/amisandbox-m2_3-evidence
          MEDIA=/tmp/amisandbox-m2_3-media
          rm -rf "$AMISANDBOX_ANALYSIS_DIR" "$EVIDENCE" "$MEDIA"
          mkdir -p "$AMISANDBOX_ANALYSIS_DIR" "$EVIDENCE" "$MEDIA"

          # Standard DD ADF-sized disposable evidence object.
          truncate -s 901120 "$MEDIA/original.adf"
          printf 'AMISANDBOX-M2.3-EVIDENCE' | dd of="$MEDIA/original.adf" bs=1 seek=1024 conv=notrunc status=none
          BEFORE_SHA=$(sha256sum "$MEDIA/original.adf" | awk '{print $1}')
          export BEFORE_SHA MEDIA

          IPC_SOCKET="${XDG_RUNTIME_DIR:-/tmp}/amiberry.sock"
          export IPC_SOCKET
          rm -f "$IPC_SOCKET"

          xvfb-run -a ./build-m2_3/amiberry \
            -cfgparam=floppy_write_protect=false \
            "-cfgparam=floppy0=${MEDIA}/original.adf" \
            --model A500 -G -S 0 --log \
            > "$EVIDENCE/analysis-media.log" 2>&1 &
          AMIBERRY_PID=$!

          cleanup() {
            if kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              kill "$AMIBERRY_PID" || true
              wait "$AMIBERRY_PID" || true
            fi
            rm -f "$IPC_SOCKET"
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if [ -S "$IPC_SOCKET" ]; then break; fi
            if ! kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              cat "$EVIDENCE/analysis-media.log"
              exit 1
            fi
            sleep 0.5
          done
          test -S "$IPC_SOCKET"

          grep -F 'AmiSandbox: forcing floppy_write_protect=true in analysis mode' "$EVIDENCE/analysis-media.log"
          grep -F "$MEDIA/original.adf" "$EVIDENCE/analysis-media.log"

          python3 - <<'PY'
          import hashlib, json, os, socket, time
          from pathlib import Path

          analysis = Path(os.environ['AMISANDBOX_ANALYSIS_DIR'])
          media = Path(os.environ['MEDIA']) / 'original.adf'
          meta = json.loads((analysis / 'session.json').read_text())
          assert meta['amisandbox_version'] == 'm2.3', meta
          assert meta['jit_enabled'] is False, meta
          assert meta['external_networking_enabled'] is False, meta
          current = hashlib.sha256(media.read_bytes()).hexdigest()
          assert current == os.environ['BEFORE_SHA'], (current, os.environ['BEFORE_SHA'])

          path = os.environ['IPC_SOCKET']
          deadline = time.monotonic() + 15
          while True:
              try:
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
                      s.settimeout(1)
                      s.connect(path)
                      s.sendall(b'GET_VERSION\n')
                      response = s.recv(4096).decode(errors='replace').strip()
                  if response.startswith('OK'):
                      break
              except (FileNotFoundError, ConnectionRefusedError, socket.timeout):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit('IPC did not become ready')
              time.sleep(.1)
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(2)
              s.connect(path)
              s.sendall(b'QUIT\n')
              response = s.recv(4096).decode(errors='replace').strip()
          assert response.startswith('OK'), response
          print('PASS: M2.3 original removable-media image remained unchanged')
          PY

          wait "$AMIBERRY_PID"
          trap - EXIT
          rm -f "$IPC_SOCKET"
          test "$(sha256sum "$MEDIA/original.adf" | awk '{print $1}')" = "$BEFORE_SHA"

      - name: Normal mode remains unaffected
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          unset AMISANDBOX_ANALYSIS_DIR AMISANDBOX_MACHINE_PROFILE AMISANDBOX_CONFIG_FINGERPRINT
          EVIDENCE=/tmp/amisandbox-m2_3-evidence
          IPC_SOCKET="${XDG_RUNTIME_DIR:-/tmp}/amiberry.sock"
          export IPC_SOCKET
          rm -f "$IPC_SOCKET"

          xvfb-run -a ./build-m2_3/amiberry \
            -cfgparam=floppy_write_protect=false \
            --model A500 -G -S 0 --log \
            > "$EVIDENCE/normal-media.log" 2>&1 &
          AMIBERRY_PID=$!

          cleanup() {
            if kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              kill "$AMIBERRY_PID" || true
              wait "$AMIBERRY_PID" || true
            fi
            rm -f "$IPC_SOCKET"
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if [ -S "$IPC_SOCKET" ]; then break; fi
            if ! kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              cat "$EVIDENCE/normal-media.log"
              exit 1
            fi
            sleep 0.5
          done
          test -S "$IPC_SOCKET"
          ! grep -F 'AmiSandbox: forcing floppy_write_protect=true in analysis mode' "$EVIDENCE/normal-media.log"

          python3 - <<'PY'
          import os, socket, time
          path = os.environ['IPC_SOCKET']
          deadline = time.monotonic() + 15
          while True:
              try:
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
                      s.settimeout(1)
                      s.connect(path)
                      s.sendall(b'GET_VERSION\n')
                      response = s.recv(4096).decode(errors='replace').strip()
                  if response.startswith('OK'):
                      break
              except (FileNotFoundError, ConnectionRefusedError, socket.timeout):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit('IPC did not become ready')
              time.sleep(.1)
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(2)
              s.connect(path)
              s.sendall(b'QUIT\n')
              response = s.recv(4096).decode(errors='replace').strip()
          assert response.startswith('OK'), response
          print('PASS: normal mode remains unaffected by M2.3 analysis-only override')
          PY

          wait "$AMIBERRY_PID"
          trap - EXIT
          rm -f "$IPC_SOCKET"

      - name: Upload M2.3 qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amisandbox-m2_3-removable-media-isolation-evidence
          path: |
            /tmp/amisandbox-m2_3-evidence/
            /tmp/amisandbox-m2_3-analysis/
            /tmp/amisandbox-m2_3-media/
          if-no-files-found: warn
          retention-days: 14
