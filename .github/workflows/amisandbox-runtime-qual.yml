name: AmiSandbox Runtime Qualification

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/amisandbox/**'
      - 'src/osdep/main.cpp'
      - 'src/osdep/amiberry_ipc*'
      - 'tools/amisandbox_cpu_sampler.py'
      - 'tools/amisandbox_memory_watch.py'
      - 'tools/check_amisandbox_m1.py'
      - 'tools/check_amisandbox_m1_1.py'
      - 'tools/check_amisandbox_m1_2.py'
      - '.github/workflows/amisandbox-runtime-qual.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'

permissions:
  contents: read

jobs:
  runtime-qual-m1-m1_2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          # mpg123.h is required by Amiberry's audio build path.
          sudo apt-get install -y \
            build-essential cmake ninja-build xvfb xauth \
            libflac-dev libmpeg2-4-dev libpng-dev libasound2-dev \
            libmpg123-dev libportmidi-dev libserialport-dev libenet-dev \
            libpcap-dev libzstd-dev libcurl4-openssl-dev nlohmann-json3-dev

      - name: Install SDL3 and SDL3_image
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3.2.8
          version-sdl-image: 3.2.4
          pre-release: false

      - name: Static M1/M1.1/M1.2 contract checks
        run: |
          python3 tools/check_amisandbox_m1.py
          python3 tools/check_amisandbox_m1_1.py
          python3 tools/check_amisandbox_m1_2.py

      - name: Build analysis configuration
        run: |
          cmake -S . -B build-m1_1 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH='${{ steps.sdl.outputs.prefix }}' \
            -DUSE_JIT=OFF \
            -DUSE_IPC_SOCKET=ON \
            -DUSE_PPC=OFF \
            -DUSE_QEMU_PPC=OFF
          cmake --build build-m1_1 -j"$(nproc)"

      - name: Runtime qualification with built-in AROS fallback ROM
        shell: bash
        env:
          AMISANDBOX_ANALYSIS_DIR: /tmp/amisandbox-m1_1
          AMISANDBOX_MACHINE_PROFILE: a500-aros-ci
          AMISANDBOX_CONFIG_FINGERPRINT: github-actions-m1_2
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          rm -rf "$AMISANDBOX_ANALYSIS_DIR"
          mkdir -p "$AMISANDBOX_ANALYSIS_DIR"

          IPC_SOCKET="${XDG_RUNTIME_DIR:-/tmp}/amiberry.sock"
          export IPC_SOCKET
          echo "IPC_SOCKET=$IPC_SOCKET"
          rm -f "$IPC_SOCKET"

          xvfb-run -a ./build-m1_1/amiberry --model A500 -G -S 0 --log \
            > /tmp/amisandbox-amiberry.log 2>&1 &
          AMIBERRY_PID=$!
          echo "AMIBERRY_PID=$AMIBERRY_PID"

          cleanup() {
            if kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              kill "$AMIBERRY_PID" || true
              wait "$AMIBERRY_PID" || true
            fi
            rm -f "$IPC_SOCKET"
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if [ -S "$IPC_SOCKET" ]; then
              break
            fi
            if ! kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              echo 'AmiSandbox exited before IPC became available'
              cat /tmp/amisandbox-amiberry.log
              exit 1
            fi
            sleep 0.5
          done

          test -S "$IPC_SOCKET"
          test -f "$AMISANDBOX_ANALYSIS_DIR/session.json"
          test -f "$AMISANDBOX_ANALYSIS_DIR/events.jsonl"

          python3 tools/amisandbox_cpu_sampler.py \
            --socket "$IPC_SOCKET" \
            --count 12 \
            --interval-ms 100

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/amisandbox-m1_1')
          session = json.loads((root / 'session.json').read_text())
          assert session['jit_enabled'] is False
          assert session['machine_profile'] == 'a500-aros-ci'

          events = [json.loads(line) for line in (root / 'events.jsonl').read_text().splitlines() if line.strip()]
          assert any(e.get('type') == 'session.start' for e in events)

          snaps = [json.loads(line) for line in (root / 'cpu-snapshots.jsonl').read_text().splitlines() if line.strip()]
          assert len(snaps) >= 10, len(snaps)
          for s in snaps:
              data = s['data']
              assert len(data['d']) == 8
              assert len(data['a']) == 8
              assert 'pc' in data and 'sr' in data

          first = snaps[0]['data']
          changing = any(
              any(s['data'][k] != first[k] for k in ('pc', 'sr'))
              or s['data']['d'] != first['d']
              or s['data']['a'] != first['a']
              for s in snaps[1:]
          )
          assert changing, 'CPU state did not change across samples'
          print(f'PASS: {len(snaps)} live CPU snapshots; CPU state changed')
          PY

          # M1.2: use the end of the configured 512 KiB Slow RAM bank.
          # Low Chip RAM is intentionally avoided here because the AROS fallback
          # can leave ROM overlay mapped over address 0 during this CI boot state.
          # The watcher remains read-only; WRITE_MEM is used only by qualification.
          WATCH_ADDRESS=0x00c7fff0
          WATCH_ADDRESS_UNCHANGED=0x00c7fff4
          export WATCH_ADDRESS WATCH_ADDRESS_UNCHANGED

          python3 - <<'PY'
          import os
          import socket

          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(2)
          s.connect(os.environ['IPC_SOCKET'])
          s.sendall(b'PAUSE\n')
          response = s.recv(4096).decode(errors='replace').strip()
          s.close()
          assert response.startswith('OK'), response
          print('PASS: guest paused for deterministic M1.2 mutation')
          PY

          python3 tools/amisandbox_memory_watch.py \
            --socket "$IPC_SOCKET" \
            --address "$WATCH_ADDRESS" \
            --address "$WATCH_ADDRESS_UNCHANGED" \
            --width 4 \
            --count 30 \
            --interval-ms 100 &
          WATCH_PID=$!

          # Give the watcher time to complete IPC readiness and baseline capture.
          sleep 1

          python3 - <<'PY'
          import os
          import socket

          sock = os.environ['IPC_SOCKET']
          addr = os.environ['WATCH_ADDRESS']
          unchanged_addr = os.environ['WATCH_ADDRESS_UNCHANGED']

          def command(*parts):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(2)
              s.connect(sock)
              s.sendall(("\t".join(str(part) for part in parts) + '\n').encode('ascii'))
              data = b''
              while b'\n' not in data:
                  chunk = s.recv(4096)
                  if not chunk:
                      break
                  data += chunk
              s.close()
              line = data.decode().splitlines()[0]
              fields = line.split('\t')
              assert fields[0] == 'OK', line
              return fields[1:]

          old = int(command('READ_MEM', addr, 4)[0], 0)
          unchanged = int(command('READ_MEM', unchanged_addr, 4)[0], 0)
          new = old ^ 0x00000001
          command('WRITE_MEM', addr, 4, new)
          read_back = int(command('READ_MEM', addr, 4)[0], 0)
          assert read_back == new, (old, new, read_back)
          unchanged_read_back = int(command('READ_MEM', unchanged_addr, 4)[0], 0)
          assert unchanged_read_back == unchanged, (unchanged, unchanged_read_back)
          with open('/tmp/amisandbox-m1_1/m1_2_test_values.txt', 'w', encoding='utf-8') as f:
              f.write(f'{addr} {old} {new} {unchanged_addr} {unchanged}\n')
          print(f'M1.2 mutation verified: {addr} {old:#010x} -> {new:#010x}; {unchanged_addr} unchanged')
          PY

          wait "$WATCH_PID"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/amisandbox-m1_1')
          addr_text, old_text, new_text, unchanged_addr_text, unchanged_text = (root / 'm1_2_test_values.txt').read_text().split()
          old = int(old_text)
          new = int(new_text)
          changes = [json.loads(line) for line in (root / 'memory-changes.jsonl').read_text().splitlines() if line.strip()]
          matching = [e for e in changes if e['data']['address'] == f"0x{int(addr_text, 0):08x}" and int(e['data']['old_value'], 16) == old and int(e['data']['new_value'], 16) == new]
          assert len(matching) == 1, matching
          event = matching[0]
          assert event['type'] == 'memory.change'
          assert event['data']['width'] == 4
          unchanged_events = [e for e in changes if e['data']['address'] == f"0x{int(unchanged_addr_text, 0):08x}"]
          assert unchanged_events == [], unchanged_events
          print('PASS: M1.2 observed exactly one controlled memory.change event and no event for unchanged watched address')
          PY

          python3 - <<'PY'
          import os
          import socket
          from pathlib import Path

          sock = os.environ['IPC_SOCKET']
          addr_text, old_text, _, _, _ = Path('/tmp/amisandbox-m1_1/m1_2_test_values.txt').read_text().split()

          def command(*parts):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(2)
              s.connect(sock)
              s.sendall(("\t".join(str(part) for part in parts) + '\n').encode('ascii'))
              data = b''
              while b'\n' not in data:
                  chunk = s.recv(4096)
                  if not chunk:
                      break
                  data += chunk
              s.close()
              line = data.decode().splitlines()[0]
              fields = line.split('\t')
              assert fields[0] == 'OK', line
              return fields[1:]

          old = int(old_text)
          command('WRITE_MEM', addr_text, 4, old)
          read_back = int(command('READ_MEM', addr_text, 4)[0], 0)
          assert read_back == old, (old, read_back)
          print('PASS: M1.2 controlled mutation restored and verified')
          PY

          python3 - <<'PY'
          import os
          import socket
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(2)
          s.connect(os.environ['IPC_SOCKET'])
          s.sendall(b'RESUME\n')
          response = s.recv(4096).decode(errors='replace').strip()
          s.close()
          assert response.startswith('OK'), response
          print('PASS: guest resumed after M1.2 qualification')
          PY

          python3 - <<'PY'
          import os
          import socket
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect(os.environ['IPC_SOCKET'])
          s.sendall(b'QUIT\n')
          print(s.recv(4096).decode(errors='replace').strip())
          s.close()
          PY

          for i in $(seq 1 40); do
            if ! kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          wait "$AMIBERRY_PID"
          trap - EXIT
          rm -f "$IPC_SOCKET"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/amisandbox-m1_1/events.jsonl')
          events = [json.loads(line) for line in p.read_text().splitlines() if line.strip()]
          assert any(e.get('type') == 'session.stop' for e in events), events
          print('PASS: M1 session.stop observed after clean emulator exit')
          PY

      - name: No-analysis normal-mode smoke test
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          unset AMISANDBOX_ANALYSIS_DIR AMISANDBOX_MACHINE_PROFILE AMISANDBOX_CONFIG_FINGERPRINT
          IPC_SOCKET="${XDG_RUNTIME_DIR:-/tmp}/amiberry.sock"
          export IPC_SOCKET
          rm -f "$IPC_SOCKET"
          rm -rf /tmp/amisandbox-no-analysis

          xvfb-run -a ./build-m1_1/amiberry --model A500 -G -S 0 --log \
            > /tmp/amisandbox-no-analysis.log 2>&1 &
          AMIBERRY_PID=$!

          cleanup() {
            if kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              kill "$AMIBERRY_PID" || true
              wait "$AMIBERRY_PID" || true
            fi
            rm -f "$IPC_SOCKET"
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if [ -S "$IPC_SOCKET" ]; then
              break
            fi
            if ! kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              echo 'Amiberry exited before IPC became available in no-analysis mode'
              cat /tmp/amisandbox-no-analysis.log
              exit 1
            fi
            sleep 0.5
          done
          test -S "$IPC_SOCKET"
          test ! -e /tmp/amisandbox-no-analysis/session.json
          test ! -e /tmp/amisandbox-no-analysis/events.jsonl

          python3 - <<'PY'
          import os
          import socket
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect(os.environ['IPC_SOCKET'])
          s.sendall(b'QUIT\n')
          response = s.recv(4096).decode(errors='replace').strip()
          s.close()
          assert response.startswith('OK'), response
          print('PASS: normal mode started and accepted clean QUIT with analysis env unset')
          PY

          for i in $(seq 1 40); do
            if ! kill -0 "$AMIBERRY_PID" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          wait "$AMIBERRY_PID"
          trap - EXIT
          rm -f "$IPC_SOCKET"
          echo 'PASS: no analysis artifacts created with AMISANDBOX_ANALYSIS_DIR unset'

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amisandbox-m1-m1_2-runtime-evidence
          path: |
            /tmp/amisandbox-m1_1/
            /tmp/amisandbox-amiberry.log
            /tmp/amisandbox-no-analysis.log
          if-no-files-found: warn
          retention-days: 14
